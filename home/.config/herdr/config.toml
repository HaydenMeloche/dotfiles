onboarding = false

[theme]
name = "tokyo-night"
auto_switch = false

[theme.custom]
panel_bg = "#2d333b"

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = false
prompt_new_tab_name = false
status_indicators = "symbols"

[ui.sound]
enabled = false

[ui.toast]
delivery = "system"

[keys]
previous_agent = "alt+shift+k"
next_agent = "alt+shift+j"
focus_agent = "alt+1..9"
focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"
previous_tab = "alt+shift+h"
next_tab = "alt+shift+l"
settings = "prefix+comma"
detach = "prefix+d"
split_horizontal = "prefix+s"
split_vertical = "prefix+v"
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"
cycle_pane_next = "prefix+w"
workspace_picker = "prefix+a"
goto = "prefix+k"
resize_pane_left = "prefix+<"
resize_pane_right = "prefix+>"
resize_pane_up = "prefix+plus"
resize_pane_down = "prefix+minus"
close_pane = "prefix+q"
new_tab = "prefix+t"
last_pane = "prefix+p"
